<html>
    <head>
        <title>Registration Form</title>
    <style>
      body{
          background-color:pink; 
          text-align: center;
          font-family: Arial;
      }
      input,select{
        padding:8px;
        margin:5px;
      }
      button{
        padding:8px;
        background-color:black;
        color:white;
      }
      </style>
    </head>
  <body>  
      <h1>Registration form</h1> Form </h1>
      <label>student name</label>
      <input type="text" id="student name" placeholder="enter name">
      <br><br>
      <label>Roll number</label>
      <input type="text" id="roll number" placeholder="enter roll number">
      <br></br>
      <label>Branch</label>
      <select>
        <option> CSE</option>
        <option>AI</option>
        <option>AIML</option>
        <option>DS</option>
        <option>ECE</option>
      </select>
      <br><br>
      <label>Gmail</label>
      <input type="text" id="gmail"placeholder="enter gmail">
       <br><br>
       <label>password</label>
       <input type="password" id="password"placeholder="enter password">
       <br><br>
       <label>gender</label>
       <input type="radio" name="gender">male
       <input type="radio" name="gender">female
       <input type="radio" name="gender">others
       <br><br>
       <label>address</label>
       <input type="address" id="address" placeholder="enter address">
       <br><br>
       <button id="registration button">submit</button>
    </body>
</html>
