<!DOCTYPE html>
<html>
<head>
    <title>Student Management System</title>
    <style>
        body {
            font-family: Arial;
            background-color: lightblue;
            text-align: center;
        }
        .container {
            width: 800px;
            margin: 30px auto;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
        }
        input {
            padding: 10px;
            margin: 5px;
            width: 130px;
        }
        button {
            padding: 10px 20px;
            margin: 10px;
            border: none;
            background-color: green;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: darkgreen;
        }
        table {
            width: 100%;
            margin-top: 25px;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid black;
            padding: 10px;
        }
        th {
            background-color: #3498db;
            color: white;
        }
        .delete {
            background-color: red;
            padding: 6px 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Student Management System</h1>
        <h3>Enter Student Details</h3>
        <input type="text" id="name" placeholder="Student name">
        <input type="text" id="roll" placeholder="Roll number">
        <br>
        <input type="number" id="maths" placeholder="Maths marks">
        <input type="number" id="science" placeholder="Science marks">
        <input type="number" id="english" placeholder="English marks">
        <br>
        <input type="number" id="computer" placeholder="Computer marks">
        <input type="number" id="social" placeholder="Social marks">
        <br>
        <button onclick="addStudent()">Add Student</button>
        
        <h2>Student Details</h2>
        <table>
            <tr>
                <th>Name</th>
                <th>Roll No</th>
                <th>Maths</th>
                <th>Science</th>
                <th>English</th>
                <th>Computer</th>
                <th>Social</th>
                <th>Total</th>
                <th>Percentage</th>
                <th>Grade</th>
                <th>Action</th>
            </tr>
            <tbody id="studentTable"></tbody>
        </table>
    </div>

    <script>
        function addStudent() {
            var name = document.getElementById("name").value.trim();
            var roll = document.getElementById("roll").value.trim();
            var maths = Number(document.getElementById("maths").value) || 0;
            var science = Number(document.getElementById("science").value) || 0;
            var english = Number(document.getElementById("english").value) || 0;
            var computer = Number(document.getElementById("computer").value) || 0;
            var social = Number(document.getElementById("social").value) || 0;

            if (name === "" || roll === "") {
                alert("Please enter student name and roll number");
                return;
            }

            var total = maths + science + english + computer + social;
            var percentage = total / 5;
            var grade;

            if (percentage >= 90) {
                grade = "A";
            } else if (percentage >= 80) {
                grade = "B";
            } else if (percentage >= 70) {
                grade = "C";
            } else if (percentage >= 60) {
                grade = "D";
            } else if (percentage >= 50) {
                grade = "E";
            } else {
                grade = "F";
            }

            var table = document.getElementById("studentTable");
            var row = table.insertRow();
            
            row.insertCell(0).innerHTML = name;
            row.insertCell(1).innerHTML = roll;
            row.insertCell(2).innerHTML = maths;
            row.insertCell(3).innerHTML = science;
            row.insertCell(4).innerHTML = english;
            row.insertCell(5).innerHTML = computer;
            row.insertCell(6).innerHTML = social;
            row.insertCell(7).innerHTML = total;
            row.insertCell(8).innerHTML = percentage.toFixed(2) + "%";
            row.insertCell(9).innerHTML = grade;
            row.insertCell(10).innerHTML = '<button class="delete" onclick="deleteStudent(this)">Delete</button>';
            document.getElementById("name").value = "";
            document.getElementById("roll").value = "";
            document.getElementById("maths").value = "";
            document.getElementById("science").value = "";
            document.getElementById("english").value = "";
            document.getElementById("computer").value = "";
            document.getElementById("social").value = "";
        }
        function deleteStudent(button) {
            var row = button.parentNode.parentNode;
            row.parentNode.removeChild(row);
        }
    </script>
</body>
</html>
